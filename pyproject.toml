[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "netsage-ai"
version = "0.1.0"
description = "Human-reviewed Cisco Packet Tracer fault diagnosis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib",
    "openpyxl",
    "pandas",
    "requests",
]
