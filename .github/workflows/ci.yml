name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt pytest ruff
      - run: pip install -e .
      - run: ruff check --select E9,F63,F7,F82 src tests  # syntax and undefined-name errors only; widen once existing lint is cleaned up
      - run: python -m pytest -q  # tests import root-level modules; see PR note
